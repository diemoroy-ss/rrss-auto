<svg width="320" height="78" viewBox="0 0 320 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isotipo: Cubo Isométrico con S y P grabadas en perspectiva -->
  <g transform="translate(12, 10)">
    <!-- Marco contenedor suave con micro-borde -->
    <rect x="0" y="0" width="58" height="58" rx="15" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Cara Superior (Tapa del cubo) -->
    <path d="M29 11L47 21L29 31L11 21L29 11Z" fill="url(#topGradSP1)"/>
    <!-- Brillo superior / nodo central -->
    <circle cx="29" cy="21" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Cara Izquierda con la letra "S" en perspectiva isométrica (skewY 30deg) -->
    <g>
      <path d="M29 31L11 21V43L29 53V31Z" fill="url(#leftGradSP1)"/>
      <!-- S proyectada en el plano izquierdo -->
      <g transform="translate(29, 31) matrix(0.866025, 0.5, 0, 1, 0, 0)">
        <text x="-16" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" opacity="0.95" letter-spacing="-0.5">S</text>
      </g>
    </g>
    
    <!-- Cara Derecha con la letra "P" en perspectiva isométrica (skewY -30deg) -->
    <g>
      <path d="M29 31L47 21V43L29 53V31Z" fill="url(#rightGradSP1)"/>
      <!-- P proyectada en el plano derecho -->
      <g transform="translate(29, 31) matrix(0.866025, -0.5, 0, 1, 0, 0)">
        <text x="5" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" opacity="0.95" letter-spacing="-0.5">P</text>
      </g>
    </g>

    <!-- Aristas divisorias finas para dar relieve 3D -->
    <path d="M29 31V53" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
    <path d="M29 31L11 21" stroke="#FFFFFF" stroke-width="1.2" opacity="0.2"/>
    <path d="M29 31L47 21" stroke="#FFFFFF" stroke-width="1.2" opacity="0.2"/>
  </g>

  <!-- Tipografía SocialPilot by Santisoft -->
  <text x="82" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Social<tspan fill="#FF6B00">Pilot</tspan>
  </text>
  <g transform="translate(83, 46)">
    <rect x="0" y="0" width="104" height="16" rx="4" fill="#1E293B" opacity="0.8"/>
    <text x="8" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#CBD5E1" letter-spacing="1.5">
      BY SANTISOFT
    </text>
  </g>

  <defs>
    <linearGradient id="topGradSP1" x1="11" y1="11" x2="47" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9E3B"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="leftGradSP1" x1="11" y1="21" x2="29" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="rightGradSP1" x1="29" y1="21" x2="47" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9A3412"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>
</svg>
