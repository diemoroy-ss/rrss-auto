<svg width="320" height="78" viewBox="0 0 320 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isotipo: Cubo Flotante con monograma SP grabado en bajo relieve tecnológico -->
  <g transform="translate(14, 12)">
    <!-- Cara Superior -->
    <path d="M26 6L46 17.5L26 29L6 17.5L26 6Z" fill="url(#topGradSP2)"/>
    <!-- Sutil flecha de navegación hacia arriba en la tapa -->
    <path d="M26 12L33 18.5L26 16L19 18.5L26 12Z" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Cara Izquierda con la "S" grabada en bajo relieve (tono naranja brillante) -->
    <path d="M26 29L6 17.5V41.5L26 53V29Z" fill="url(#leftGradSP2)"/>
    <g transform="translate(26, 29) matrix(0.866025, 0.5, 0, 1, 0, 0)">
      <!-- Sombra de relieve interior -->
      <text x="-16.5" y="10.5" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#7C2D12" opacity="0.8">S</text>
      <!-- Letra S principal -->
      <text x="-17" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">S</text>
    </g>

    <!-- Cara Derecha con la "P" grabada en bajo relieve (tono grafito-naranja oscuro) -->
    <path d="M26 29L46 17.5V41.5L26 53V29Z" fill="url(#rightGradSP2)"/>
    <g transform="translate(26, 29) matrix(0.866025, -0.5, 0, 1, 0, 0)">
      <!-- Sombra de relieve interior -->
      <text x="4.5" y="10.5" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#431407" opacity="0.9">P</text>
      <!-- Letra P principal con acento naranja -->
      <text x="4" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FF8A00">P</text>
    </g>

    <!-- Bisel central iluminado -->
    <line x1="26" y1="29" x2="26" y2="53" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Tipografía SocialPilot by Santisoft -->
  <text x="80" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Social<tspan fill="#FF6B00">Pilot</tspan>
  </text>
  <g transform="translate(81, 47)">
    <line x1="0" y1="5" x2="16" y2="5" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="3">
      BY SANTISOFT
    </text>
  </g>

  <defs>
    <linearGradient id="topGradSP2" x1="6" y1="6" x2="46" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA843"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="leftGradSP2" x1="6" y1="17.5" x2="26" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="rightGradSP2" x1="26" y1="17.5" x2="46" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C2D12"/>
      <stop offset="1" stop-color="#451A03"/>
    </linearGradient>
  </defs>
</svg>
