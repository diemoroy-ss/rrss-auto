<svg width="300" height="74" viewBox="0 0 300 74" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A2: Cubo Isométrico sin marco contenedor, flotante y dinámico -->
  <g transform="translate(14, 12)">
    <!-- Cara Superior -->
    <path d="M25 6L44 16.5L25 27L6 16.5L25 6Z" fill="url(#topA2)"/>
    <!-- Cara Derecha con degradado profundo -->
    <path d="M25 27L44 16.5V38.5L25 49V27Z" fill="url(#rightA2)"/>
    <!-- Cara Izquierda -->
    <path d="M25 27L6 16.5V38.5L25 49V27Z" fill="url(#leftA2)"/>
    <!-- Flecha de Navegación / Piloto grabada sutilmente en la cara superior -->
    <path d="M25 11L33 18L25 15L17 18L25 11Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Vértice inferior con pulso naranja -->
    <circle cx="25" cy="27" r="3" fill="#FFFFFF"/>
    <circle cx="25" cy="49" r="2" fill="#FF8A00"/>
  </g>
  <!-- Tipografía A2: Monocromo Elegante con Acento de Marca -->
  <text x="76" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Social<tspan fill="#FF6B00">Pilot</tspan>
  </text>
  <g transform="translate(77, 45)">
    <!-- Línea sutil de arquitectura -->
    <line x1="0" y1="5" x2="16" y2="5" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="3">
      BY SANTISOFT
    </text>
  </g>
  <defs>
    <linearGradient id="topA2" x1="6" y1="6" x2="44" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA439"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="rightA2" x1="25" y1="16" x2="44" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C2410C"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="leftA2" x1="6" y1="16" x2="25" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EA580C"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
  </defs>
</svg>
