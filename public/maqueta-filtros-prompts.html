<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Comparativa: Filtros Biblioteca de Prompts IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-8">

  <!-- ENCABEZADO DE LA MAQUETA INTERACTIVA -->
  <div class="max-w-6xl mx-auto mb-8 bg-white border border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
    <div>
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 mb-2">
        <span>✨</span> Maqueta Interactiva UI/UX
      </div>
      <h1 class="text-2xl font-black text-slate-900">Comparativa de Filtros (Sin Scroll Horizontal)</h1>
      <p class="text-slate-500 text-sm mt-1">Prueba ambas opciones tanto en modo Escritorio como en vista Celular.</p>
    </div>

    <!-- Controles de la maqueta -->
    <div class="flex flex-wrap items-center gap-3">
      <!-- Selector de Opción -->
      <div class="bg-slate-100 p-1 rounded-2xl flex items-center gap-1 border border-slate-200">
        <button id="btn-opt-1" onclick="switchOption(1)" class="px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white text-indigo-700 shadow-sm">
          Opción 1: Dropdown Premium
        </button>
        <button id="btn-opt-2" onclick="switchOption(2)" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900">
          Opción 2: Modal / Drawer Grid
        </button>
      </div>

      <!-- Selector de Vista: Desktop vs Móvil -->
      <div class="bg-slate-100 p-1 rounded-2xl flex items-center gap-1 border border-slate-200">
        <button id="btn-view-desktop" onclick="switchView('desktop')" class="px-3 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-white shadow-sm flex items-center gap-1.5">
          <span>🖥️</span> Escritorio
        </button>
        <button id="btn-view-mobile" onclick="switchView('mobile')" class="px-3 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
          <span>📱</span> Celular
        </button>
      </div>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <div id="viewport-container" class="max-w-6xl mx-auto transition-all duration-300">

    <!-- FRAME MÓVIL (se activa en modo mobile) -->
    <div id="mobile-frame" class="hidden max-w-sm mx-auto bg-slate-900 p-3 rounded-[44px] shadow-2xl border-4 border-slate-800">
      <!-- Barra de estado simulada -->
      <div class="flex justify-between items-center px-4 py-2 text-white text-[10px] font-bold">
        <span>09:41</span>
        <div class="w-16 h-4 bg-black rounded-full"></div>
        <div class="flex items-center gap-1"><span>5G</span><span>🔋</span></div>
      </div>
      <!-- Pantalla interior del teléfono -->
      <div class="bg-slate-50 rounded-[34px] p-4 min-h-[640px] max-h-[720px] overflow-y-auto custom-scrollbar relative">
        <div id="mobile-content-mount"></div>
      </div>
    </div>

    <!-- VISTA ESCRITORIO (por defecto) -->

          <div class="relative h-52 bg-slate-950 flex items-center justify-center">
            <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500&q=80" alt="Times Square" class="max-w-full max-h-full object-contain group-hover:scale-105 transition-transform duration-300">

  <script>
    let currentOption = 1;
    let currentView = 'desktop';

    function renderCurrent() {
      const tmpl = document.getElementById(`tmpl-option-${currentOption}`);
      const desktopMount = document.getElementById('desktop-content-mount');
      const mobileMount = document.getElementById('mobile-content-mount');
      
      desktopMount.innerHTML = tmpl.innerHTML;
      mobileMount.innerHTML = tmpl.innerHTML;
    }

    function switchOption(opt) {
      currentOption = opt;
      document.getElementById('btn-opt-1').className = opt === 1 
        ? "px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white text-indigo-700 shadow-sm"
        : "px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900";
      document.getElementById('btn-opt-2').className = opt === 2 
        ? "px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white text-indigo-700 shadow-sm"
        : "px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900";
      renderCurrent();
    }

    function switchView(view) {
      currentView = view;
      const desktopView = document.getElementById('desktop-view');
      const mobileFrame = document.getElementById('mobile-frame');
      const btnDesktop = document.getElementById('btn-view-desktop');
      const btnMobile = document.getElementById('btn-view-mobile');

      if (view === 'mobile') {
        desktopView.classList.add('hidden');
        mobileFrame.classList.remove('hidden');
        btnMobile.className = "px-3 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-white shadow-sm flex items-center gap-1.5";
        btnDesktop.className = "px-3 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
      } else {
        desktopView.classList.remove('hidden');
        mobileFrame.classList.add('hidden');
        btnDesktop.className = "px-3 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-white shadow-sm flex items-center gap-1.5";
        btnMobile.className = "px-3 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
      }
    }

    // INTERACCIONES OPCIÓN 1
    function toggleDropdownOpt1(btn) {
      const menu = btn.parentElement.querySelector('#opt1-dropdown-menu');
      if (menu) {
        menu.classList.toggle('hidden');
      }
    }

    function selectStyleOpt1(name, count, icon) {
      const labels = document.querySelectorAll('#opt1-selected-label');
      const badges = document.querySelectorAll('#opt1-count-badge');
      const menus = document.querySelectorAll('#opt1-dropdown-menu');

      labels.forEach(el => el.textContent = name === 'Todos los Estilos' ? 'Estilo: Todos los Estilos' : name);
      badges.forEach(el => el.textContent = count);
      menus.forEach(el => el.classList.add('hidden'));
    }

    // INTERACCIONES OPCIÓN 2
    function openModalOpt2() {
      document.getElementById('modal-opt2-backdrop').classList.remove('hidden');
    }

    function closeModalOpt2() {
      document.getElementById('modal-opt2-backdrop').classList.add('hidden');
    }

    function applyStyleOpt2(name, count) {
      closeModalOpt2();
      const badgeBars = document.querySelectorAll('#opt2-active-badge-bar');
      const activeTexts = document.querySelectorAll('#opt2-active-style-text');
      const btnLabels = document.querySelectorAll('#opt2-btn-label');

      if (name === 'Todos los Estilos') {
        badgeBars.forEach(el => el.classList.add('hidden'));
        btnLabels.forEach(el => el.textContent = 'Filtrar Estilos');
      } else {
        badgeBars.forEach(el => el.classList.remove('hidden'));
        activeTexts.forEach(el => el.textContent = name);
        btnLabels.forEach(el => el.textContent = name);
      }
    }

    function resetStyleOpt2() {
      applyStyleOpt2('Todos los Estilos', 39);
    }

    // Inicializar
    renderCurrent();
  </script>
