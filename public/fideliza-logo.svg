<svg width="280" height="56" viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isotipo: Doble Tarjeta VIP / Smart Wallet con Chip F y ondas NFC -->
  <g transform="translate(6, 6)">
    <!-- Tarjeta trasera naranja en rotación sutil -->
    <rect x="7" y="3" width="36" height="27" rx="6" fill="#EA580C" opacity="0.45" transform="rotate(7 7 3)" />
    <!-- Tarjeta frontal VIP oscura con borde dorado reflectante -->
    <rect x="2" y="9" width="38" height="29" rx="7" fill="url(#op3Card)" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Chip de fidelidad dorado -->
    <rect x="7" y="14" width="8" height="7" rx="2" fill="#FDE047" />
    <!-- Líneas del chip -->
    <path d="M7 17.5H15M11 14V21" stroke="#D97706" stroke-width="0.8" opacity="0.6"/>
    <!-- Letra F moderna blanca -->
    <path d="M22 16H32M22 21.5H28M22 16V30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Ondas NFC lealtad -->
    <path d="M33 24C34.5 25.5 34.5 27.5 33 29" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Tipografía Fideliza Grande y Nítida -->
  <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Fide<tspan fill="#FF922B">liza</tspan>
  </text>

  <!-- Subtítulo BY SOCIALPILOT -->
  <text x="65" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#94A3B8" letter-spacing="2.6">
    BY SOCIAL<tspan fill="#FF6B00">PILOT</tspan>
  </text>

  <defs>
    <linearGradient id="op3Card" x1="2" y1="9" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" />
      <stop offset="1" stop-color="#0B1120" />
    </linearGradient>
  </defs>
</svg>
