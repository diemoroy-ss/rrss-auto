<svg width="280" height="56" viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isotipo: Doble Tarjeta VIP / Smart Wallet Light -->
  <g transform="translate(6, 6)">
    <!-- Tarjeta trasera naranja suave en rotación sutil -->
    <rect x="7" y="3" width="36" height="27" rx="6" fill="#F97316" opacity="0.3" transform="rotate(7 7 3)" />
    <!-- Tarjeta frontal VIP blanca con borde naranja -->
    <rect x="2" y="9" width="38" height="29" rx="7" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.8" />
    <!-- Chip de fidelidad dorado -->
    <rect x="7" y="14" width="8" height="7" rx="2" fill="#F59E0B" />
    <!-- Líneas del chip -->
    <path d="M7 17.5H15M11 14V21" stroke="#9A3412" stroke-width="0.8" opacity="0.5"/>
    <!-- Letra F moderna oscura -->
    <path d="M22 16H32M22 21.5H28M22 16V30" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <!-- Ondas NFC lealtad -->
    <path d="M33 24C34.5 25.5 34.5 27.5 33 29" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Tipografía Fideliza Grande y Nítida -->
  <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
    Fide<tspan fill="#EA580C">liza</tspan>
  </text>

  <!-- Subtítulo BY SOCIALPILOT -->
  <text x="65" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#64748B" letter-spacing="2.6">
    BY SOCIAL<tspan fill="#EA580C">PILOT</tspan>
  </text>
</svg>
