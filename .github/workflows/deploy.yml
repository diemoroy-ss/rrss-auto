name: Deploy to DigitalOcean (rrss-auto)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN
          command_timeout: 20m
          script: |
            set -e
            # Cargar NVM y Node.js para entorno SSH no interactivo
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Ruta de producción en Lightsail
            cd /var/www/santisoft-auto
            
            echo "Descargando últimos cambios de GitHub y limpiando espacio de trabajo..."
            git fetch https://x-access-token:${GITHUB_TOKEN}@github.com/diemoroy-ss/rrss-auto.git main
            git reset --hard FETCH_HEAD
            git clean -fd
            
            echo "Instalando dependencias..."
            npm install
            
            echo "Construyendo la aplicación..."
            # Limitamos la memoria de Node.js para evitar el swapping y congelamiento en VPS de bajos recursos
            export NODE_OPTIONS="--max-old-space-size=768"
            npm run build
            
            echo "Reiniciando PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            
            echo "¡Despliegue completado con éxito!"
